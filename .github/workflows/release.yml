name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          # IMPORTANT: use a PAT (personal access token) as secret, NOT
          # GITHUB_TOKEN. Events triggered by GITHUB_TOKEN (like the tag or
          # release this action creates) do NOT start new workflow runs, so the
          # "Build and Release Tauri App" workflow would never run.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json